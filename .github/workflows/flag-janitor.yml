name: Flag Janitor
on:
  schedule: [{ cron: '0 6 * * 1' }]   # every Monday
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  clean:
    if: github.event_name != 'pull_request'
    runs-on: self-hosted   # next to the self-hosted Flagsmith; use ubuntu-latest if yours is public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mohammedsharukhh/flag-janitor@main
        with:
          flagsmith-api-url: ${{ vars.FLAGSMITH_API_URL }}
          flagsmith-api-key: ${{ secrets.FLAGSMITH_API_KEY }}
          flagsmith-environment: ${{ vars.FLAGSMITH_ENVIRONMENT }}
          janitor-environment-key: ${{ vars.JANITOR_ENVIRONMENT_KEY }}

  archive:
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'flag-janitor/remove-')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: '${{ github.event.pull_request.base.ref }}' }
      - uses: mohammedsharukhh/flag-janitor@main
        with:
          command: archive
          flag: ${{ github.head_ref }}
          flagsmith-api-url: ${{ vars.FLAGSMITH_API_URL }}
          flagsmith-api-key: ${{ secrets.FLAGSMITH_API_KEY }}
          flagsmith-environment: ${{ vars.FLAGSMITH_ENVIRONMENT }}
          janitor-environment-key: ${{ vars.JANITOR_ENVIRONMENT_KEY }}
